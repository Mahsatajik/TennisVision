[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisvision"
version = "0.1.0"
description = "Fixed-camera tennis pose, ball tracking, and reviewable point scoring"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mahsa Tajik"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "numpy>=1.26,<3", "opencv-contrib-python>=4.10,<5", "mediapipe>=0.10.21,<0.11", "pillow>=10,<14", "imageio-ffmpeg>=0.6,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
tracknet = ["torch>=2.6,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
tennisvision = "tennisvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tennisvision = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
